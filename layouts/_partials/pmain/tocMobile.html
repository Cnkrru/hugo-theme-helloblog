{{- if .Fragments.Headings }}
{{/* 移动端目录：右下浮钮 + dialog 弹层。原项目用 Teleport 挂到 body，
     这里渲染在 #app 之外，避免 .main 的 backdrop-filter 为 fixed 后代创建包含块 */}}
<button class="toc-fab" type="button" title="{{ T "toc.open" }}" aria-label="{{ T "toc.open" }}">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="6" x2="21" y2="6" />
    <line x1="8" y1="12" x2="21" y2="12" />
    <line x1="8" y1="18" x2="21" y2="18" />
    <line x1="3" y1="6" x2="3.01" y2="6" />
    <line x1="3" y1="12" x2="3.01" y2="12" />
    <line x1="3" y1="18" x2="3.01" y2="18" />
  </svg>
</button>

<dialog class="toc-dialog" aria-label="{{ T "toc.heading" }}">
  <div class="dialog-head">
    <span>{{ T "toc.title" }}</span>
    <button class="dialog-close" type="button" title="{{ T "toc.close" }}" aria-label="{{ T "toc.close" }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>
  <div class="toc-dialog-list">
    {{- partial "pmain/tocItems.html" (dict "headings" .Fragments.Headings) }}
  </div>
</dialog>
{{- end }}
